<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 320px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #f8fafb;
            color: #1e293b;
        }

        .container {
            padding: 16px;
            display: grid;
            gap: 12px;
        }

        .header {
            font-size: 15px;
            font-weight: 700;
            color: #0f766e;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #0f766e;
            flex-shrink: 0;
        }

        .status {
            font-size: 13px;
            line-height: 1.5;
            color: #64748b;
            padding: 8px 12px;
            background: #f1f5f9;
            border-radius: 8px;
            border-left: 3px solid #cbd5e1;
        }

        .status.success {
            color: #0f766e;
            background: #f0fdfa;
            border-left-color: #0f766e;
        }

        .status.warning {
            color: #b45309;
            background: #fffbeb;
            border-left-color: #f59e0b;
        }

        .status.error {
            color: #b42318;
            background: #fef2f2;
            border-left-color: #ef4444;
        }

        .btn {
            appearance: none;
            width: 100%;
            min-height: 40px;
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #0f766e, #0b8b81);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.15s;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25);
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(15, 118, 110, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result {
            font-size: 12px;
            line-height: 1.5;
            word-break: break-word;
            min-height: 0;
        }

        .result:empty { display: none; }

        .result.success { color: #0f766e; }
        .result.error { color: #b42318; }

        .footer {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            padding-top: 4px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">K12 Video Runner</div>
        <div id="status" class="status">Đang kiểm tra trang...</div>
        <button id="run-btn" class="btn" disabled>Chạy tiến trình</button>
        <div id="result" class="result"></div>
        <div class="footer">Fallback — dùng khi nút trong trang không hiện</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
